name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup and evidence
      description: OS, terminal and dimensions, hardware if relevant, screenshot or short log. Remove private data.
    validations:
      required: true
