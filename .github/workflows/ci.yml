name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  automation:
    uses: ./.github/workflows/quality.yml
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/test_release_gate.py
  gate:
    name: Required CI
    if: ${{ always() }}
    needs: [automation, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require contributor checks
        env:
          RESULT: ${{ needs.automation.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success && test "$TEST_RESULT" = success
